baseURL: https://smartjy.github.io/future-ai-kids/
locale: ko-KR
defaultContentLanguage: ko
hasCJKLanguage: true
title: Future AI Kids
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

taxonomies:
  tag: tags
  team: teams

outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: false

params:
  # 홈 칠판에 분필 글씨로 쓰는 문구 (모든 팀에 똑같이 해당하는 말로)
  chalk: 이번 주에는 AI로 무엇을 만들까?
  description: 학생들이 팀을 이뤄 매주 AI로 하나씩 만들어가는 수업이에요.
  defaultTheme: auto
  ShowReadingTime: true
  ShowToc: true
  TocOpen: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  homeInfoParams:
    Title: Future AI Kids
    Content: 학생들이 팀을 이뤄 매주 AI로 하나씩 만들어가는 수업이에요.
  fuseOpts:
    keys: [title, summary, content]

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 1
    - identifier: about
      name: 소개
      url: about/
      weight: 5
    - identifier: posts
      name: 글
      url: posts/
      weight: 10
    - identifier: teams
      name: 팀
      url: teams/
      weight: 20
    - identifier: tags
      name: 태그
      url: tags/
      weight: 30
    - identifier: search
      name: 검색
      url: search/
      weight: 40
